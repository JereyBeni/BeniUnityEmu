[package]
name = "beni_unity_emu"
version = "0.2.0"
edition = "2021"
authors = ["Beni"]
description = "Experimental Unity emulation runtime + Beni App Picker launcher"
license = "MIT"

[dependencies]
eframe = { version = "0.27", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"

# Stage C1: real OpenGL window (Windows / desktop). Optional feature `opengl`.
winit = { version = "0.29", optional = true }
glutin = { version = "0.31", optional = true }
glutin-winit = { version = "0.4", optional = true }
glow = { version = "0.13", optional = true }
raw-window-handle = { version = "0.5", optional = true }

[features]
default = ["gui"]
gui = ["eframe"]
opengl = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:glow", "dep:raw-window-handle"]

[[bin]]
name = "BeniUnityEmu"
path = "src/main.rs"
required-features = []

[[bin]]
name = "BeniAppPicker"
path = "src/bin/beni_app_picker.rs"
required-features = ["gui"]

[[bin]]
name = "BeniOpenGL"
path = "src/bin/beni_opengl.rs"
required-features = ["opengl"]

[lib]
name = "beni_unity_emu"
path = "src/lib.rs"
