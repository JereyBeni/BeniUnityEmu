[package]
name = "beni_unity_emu"
version = "0.2.0"
edition = "2021"
authors = ["Beni"]
description = "Experimental Unity emulation runtime + Beni App Picker launcher"
license = "MIT"

[dependencies]
eframe = { version = "0.27", optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"

[features]
default = ["gui"]
gui = ["eframe"]

[[bin]]
name = "BeniUnityEmu"
path = "src/main.rs"
required-features = []

[[bin]]
name = "BeniAppPicker"
path = "src/bin/beni_app_picker.rs"
required-features = ["gui"]

[lib]
name = "beni_unity_emu"
path = "src/lib.rs"
